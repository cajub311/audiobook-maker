<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Audiobook Creator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0b1020; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo { font-size: 2rem; font-weight: 700; color: #a5b4fc; margin-bottom: 8px; }
    .sub { font-size: 1rem; color: #94a3b8; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #4338ca; }
    .note { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="logo">Audiobook Creator</div>
  <p class="sub">Turn any text into a full audiobook &mdash; free, no account needed.</p>
  <a class="btn" href="/web/index.html">Launch Web Demo</a>
  <p class="note">Full audiobook generation coming soon via cloud backend.</p>
</body>
</html>
