<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Audiobook Creator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0f172a; }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 16px;
    }
    #loader h1 { color: #e2e8f0; font-size: 1.5rem; font-weight: 600; }
    #loader p  { font-size: 0.875rem; max-width: 320px; text-align: center; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(148,163,184,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-box {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fca5a5;
      font-size: 0.8rem;
      max-width: 320px;
      text-align: center;
    }
    iframe {
      display: none;
      width: 100%; height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <h1>Audiobook Creator</h1>
    <p>Connecting to backend&hellip;</p>
    <div id="error-box"></div>
  </div>
  <iframe id="app" allow="microphone; camera; clipboard-write; fullscreen"></iframe>

  <script>
    // ── Configuration ────────────────────────────────────────────────────────
    // Replace this URL with your actual Hugging Face Spaces URL after deployment.
    // Format: https://<your-hf-username>-<space-name>.hf.space
    // Example: https://cajub311-audiobook-creator-v7.hf.space
    var GRADIO_URL = (
      // 1. Prefer an env var injected at Vercel build time (set GRADIO_SERVER_URL in Vercel dashboard)
      "%%GRADIO_SERVER_URL%%" !== "%%GRADIO_SERVER_URL%%"
        ? "%%GRADIO_SERVER_URL%%"
        // 2. Fallback: hardcode your HF Space URL here
        : "https://YOUR-HF-USERNAME-audiobook-creator-v7.hf.space"
    );

    var iframe  = document.getElementById("app");
    var loader  = document.getElementById("loader");
    var errBox  = document.getElementById("error-box");
    var TIMEOUT = 20000; // 20s before showing error

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = "block";
      document.querySelector(".spinner").style.display = "none";
    }

    // Probe backend availability before loading iframe (avoids blank iframe on cold start)
    var probeUrl = GRADIO_URL.replace(/\/$/, "") + "/";
    var timer = setTimeout(function () {
      showError("Backend is taking longer than expected to start. It may be waking up — please wait or refresh.");
    }, TIMEOUT);

    fetch(probeUrl, { method: "HEAD", mode: "no-cors" })
      .then(function () {
        clearTimeout(timer);
        iframe.src = GRADIO_URL;
        iframe.style.display = "block";
        loader.style.display = "none";
      })
      .catch(function () {
        // no-cors fetch always resolves — this only fires on hard network error
        clearTimeout(timer);
        iframe.src = GRADIO_URL;
        iframe.style.display = "block";
        loader.style.display = "none";
      });

    iframe.addEventListener("load", function () {
      clearTimeout(timer);
      loader.style.display = "none";
      iframe.style.display = "block";
    });

    iframe.addEventListener("error", function () {
      showError("Could not load the Audiobook Creator backend. Check that your Hugging Face Space is running.");
    });
  </script>
</body>
</html>
