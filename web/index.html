<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audiobook Maker - Web Demo</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b1020;
        color: #e2e8f0;
      }
      main { max-width: 900px; margin: 0 auto; padding: 16px 16px 96px; }
      .card {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.7);
        color: #e2e8f0;
        padding: 10px;
        box-sizing: border-box;
      }
      .grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      button {
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .primary { background: #4f46e5; color: #fff; }
      .secondary { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.25); }
      .status {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 12px;
      }
      @media (max-width: 768px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Audiobook Maker Web Demo</h1>
      <p>Demo mode creates a short preview (about 5 minutes max) directly in browser. Full generation still uses Python app.</p>

      <div id="status" class="status">Ready.</div>

      <section class="card">
        <label for="input"><strong>Paste text</strong></label>
        <input id="file-input" type="file" accept=".txt,text/plain" style="margin: 8px 0 10px; display: block;" />
        <textarea id="input" placeholder="Paste text for a short browser demo..."></textarea>
        <p id="stats" style="margin: 8px 0 0; font-size: 13px; opacity: 0.9;">Words: 0 · Est: 0m 0s</p>
      </section>

      <section class="card">
        <label for="browser-voice"><strong>Browser preview voice</strong></label>
        <select id="browser-voice" style="width: 100%; margin-top: 8px; min-height: 44px; border-radius: 10px; padding: 8px; background: rgba(15, 23, 42, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.3);"></select>
        <p style="margin: 8px 0 0; font-size: 12px; opacity: 0.85;">Uses your device's offline voices. The Python app uses Edge or Kokoro for final quality.</p>
      </section>

      <section class="card">
        <div class="grid">
          <button id="demo-generate" class="primary">Generate 5-minute demo</button>
          <button id="demo-speak" class="secondary">Play in browser voice</button>
          <button id="demo-share" class="secondary">Share demo text</button>
          <button id="demo-save" class="secondary">Save draft locally</button>
          <button id="demo-download" class="secondary">Download demo text</button>
        </div>
      </section>

      <section class="card">
        <h3>Output</h3>
        <pre id="output">No demo generated yet.</pre>
      </section>
    </main>

    <script type="module">
      import { makeDemoProject } from "/web/processor.js";
      import { loadDraft, saveDraft } from "/web/storage.js";
      import { pollCloudProcess, startCloudProcess } from "/web/api-client.js";

      const input = document.getElementById("input");
      const fileInput = document.getElementById("file-input");
      const status = document.getElementById("status");
      const output = document.getElementById("output");
      const stats = document.getElementById("stats");
      const generateBtn = document.getElementById("demo-generate");
      const voiceSelect = document.getElementById("browser-voice");
      let currentDemo = null;
      let isGenerating = false;
      const generateLabelIdle = "Generate 5-minute demo";

      const setStatus = (text) => { status.textContent = text; };
      const setGeneratingState = (busy) => {
        isGenerating = !!busy;
        generateBtn.disabled = !!busy;
        generateBtn.textContent = busy ? "Generating..." : generateLabelIdle;
        generateBtn.setAttribute("aria-busy", busy ? "true" : "false");
      };
      const updateStats = () => {
        const text = String(input.value || "").trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = text.length;
        const sec = Math.max(0, Math.round(chars / 28));
        const min = Math.floor(sec / 60);
        const rem = sec % 60;
        stats.textContent = `Words: ${words} · Chars: ${chars} · Est: ${min}m ${rem}s`;
      };

      input.value = loadDraft() || "";
      updateStats();
      input.addEventListener("input", updateStats);

      const fillVoiceList = () => {
        if (!("speechSynthesis" in window)) {
          voiceSelect.innerHTML = "";
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Speech synthesis not available";
          voiceSelect.appendChild(opt);
          voiceSelect.disabled = true;
          return;
        }
        const voices = window.speechSynthesis.getVoices() || [];
        const preferred = voices.filter((v) => /en[-_]/.test(v.lang || ""));
        const list = preferred.length ? preferred : voices;
        voiceSelect.innerHTML = "";
        list.forEach((v) => {
          const opt = document.createElement("option");
          opt.value = v.voiceURI || v.name;
          opt.textContent = `${v.name} (${v.lang || "?"})`;
          opt.dataset.name = v.name;
          opt.dataset.lang = v.lang || "";
          voiceSelect.appendChild(opt);
        });
        if (!voiceSelect.options.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Loading voices…";
          voiceSelect.appendChild(opt);
        }
      };
      fillVoiceList();
      window.speechSynthesis.onvoiceschanged = fillVoiceList;

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const text = await file.text();
        input.value = text;
        updateStats();
        setStatus(`Loaded ${file.name} into demo editor.`);
      });

      document.getElementById("demo-save").addEventListener("click", () => {
        const saved = saveDraft(input.value || "");
        if (saved && saved.ok) {
          setStatus("Draft saved locally.");
          return;
        }
        const detail = (saved && saved.error) ? ` (${saved.error})` : "";
        setStatus(`Could not save draft locally${detail}.`);
      });

      document.getElementById("demo-generate").addEventListener("click", async () => {
        if (isGenerating) {
          return;
        }
        if (!(input.value || "").trim()) {
          setStatus("Paste some text first.");
          return;
        }
        setGeneratingState(true);
        try {
          setStatus("Creating browser demo project...");
          currentDemo = makeDemoProject(input.value);
          output.textContent = JSON.stringify(currentDemo.summary, null, 2);
          const start = await startCloudProcess({ text: currentDemo.previewText, demoMode: true });
          if (!start.ok || !start.data || !start.data.job_id) {
            setStatus("Demo ready locally. Cloud API unavailable right now.");
            return;
          }
          const jobId = start.data.job_id;
          const intervalMs = Math.min(
            4000,
            Math.max(700, Number(start.data.suggested_poll_interval_ms) || 1000),
          );
          const estSec = Math.max(5, Number(start.data.estimated_seconds) || 30);
          const maxAttempts = Math.min(
            200,
            Math.max(30, Math.ceil((estSec * 2.2) / (intervalMs / 1000)) + 8),
          );
          setStatus(`Cloud demo job queued (${jobId}). Polling (~${Math.round(intervalMs / 100) / 10}s)…`);
          let completed = false;
          for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
            await new Promise((resolve) => setTimeout(resolve, intervalMs));
            const polled = await pollCloudProcess(jobId);
            if (!polled.ok || !polled.data) {
              continue;
            }
            const p = Number(polled.data.progress_percent || 0);
            const eta = Number(polled.data.eta_seconds || 0);
            setStatus(`Cloud job ${polled.data.status}: ${p}% · ETA ${eta}s`);
            if (polled.data.status === "completed") {
              completed = true;
              break;
            }
          }
          if (!completed) {
            setStatus("Cloud demo is taking longer than expected. Please retry in a moment.");
          }
        } finally {
          setGeneratingState(false);
        }
      });

      document.getElementById("demo-speak").addEventListener("click", () => {
        if (!currentDemo) {
          setStatus("Generate demo first.");
          return;
        }
        if (!("speechSynthesis" in window)) {
          setStatus("Browser speech synthesis not available.");
          return;
        }
        const utterance = new SpeechSynthesisUtterance(currentDemo.previewText);
        utterance.rate = 1.0;
        const voices = window.speechSynthesis.getVoices() || [];
        const sel = voiceSelect.selectedOptions && voiceSelect.selectedOptions[0];
        const uri = sel && sel.value;
        if (uri) {
          const match = voices.find((v) => (v.voiceURI || v.name) === uri);
          if (match) {
            utterance.voice = match;
          }
        }
        utterance.onstart = () => setStatus("Playing browser voice preview...");
        utterance.onend = () => setStatus("Playback finished.");
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      });

      document.getElementById("demo-share").addEventListener("click", async () => {
        if (!currentDemo) {
          setStatus("Generate demo first.");
          return;
        }
        const shareText = currentDemo.previewText.slice(0, 1000);
        if (navigator.share) {
          try {
            await navigator.share({
              title: "Audiobook Maker demo text",
              text: shareText,
            });
            setStatus("Shared demo text.");
            return;
          } catch (err) {
            if (err && err.name === "AbortError") {
              setStatus("Share cancelled.");
              return;
            }
            // Fall through to clipboard fallback.
          }
        }
        try {
          await navigator.clipboard.writeText(shareText);
          setStatus("Copied demo text to clipboard.");
        } catch (err) {
          const detail = err instanceof Error ? err.message : String(err);
          setStatus(`Share failed: ${detail}`);
        }
      });

      document.getElementById("demo-download").addEventListener("click", () => {
        if (!currentDemo) {
          setStatus("Generate demo first.");
          return;
        }
        const blob = new Blob([currentDemo.previewText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "audiobook-demo.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus("Demo text downloaded.");
      });
    </script>
  </body>
</html>
